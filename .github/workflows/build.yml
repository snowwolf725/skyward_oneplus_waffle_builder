# Author: lengyue632-commits
# Mod: SnowWolf725 
name: Build for OnePlus 12 (CPH2573)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build recovery for op12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
             submodules: true

      - uses: ./.github/actions/setup
  
      - name: Build the recovery service for the phone
        run: |
          cd skyward
          for f in $(ls -v ../patches/[0-9]*.patch); do git apply "$f"; done
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward

      - name: Build the packer
        run: |
          cd skyward
          cargo build --locked --release -p skyward-pack

      - name: Build system init
        run: |
          cd skyward
          RUSTFLAGS="-C target-feature=+crt-static" cargo ndk -t arm64-v8a --platform 30 build --release -p skyward-system-init --target-dir target/system-init

      - name: Download stock recovery 
        uses: robinraju/release-downloader@v1
        with:
          repository: "snowwolf725/OnePlus12-fw-repos"
          latest: true
          tag: PJD110_16.0.1.300(CN01)
          filename: "recovery.zip"
          out-file-path: "./"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}
          
      # 关键诊断：stock ramdisk 里到底有没有打包器硬依赖的
      # system/bin/recovery 和 prop.default。没有就得改 Rust 代码。
      - name: Inspect the stock ramdisk
        run: |
          set +e
          skyward/target/release/skyward-pack list recovery.img > ramdisk.txt 2> list.err
          echo "exit=$?"
          echo "===== 前 60 条 ====="
          head -60 ramdisk.txt
          echo "===== 关键路径 ====="
          for p in system/bin/recovery system/bin/adbd prop.default system/bin/sh init; do
            if grep -qE "(^|[[:space:]])${p}$" ramdisk.txt; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "===== system/ 下 ====="
          grep -E "system/" ramdisk.txt | head -40
          echo "===== 行数 ====="
          cat ramdisk.txt | wc -l
          cat list.err

      - name: Pack the recovery
        run: |
          cd skyward
          cp ../patches/waffle.toml devices/waffle.toml
          target/release/skyward-pack recovery \
            --stock "../recovery.img" \
            --binary target/aarch64-linux-android/release/skyward \
            --system-init target/system-init/aarch64-linux-android/release/system-init \
            --config devices/waffle.toml \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out skyward-waffle.img
          ls -l skyward-waffle.img
          sha256sum skyward-waffle.img
          zip -9 skyward-waffle.zip skyward-waffle.img
          sha256sum skyward-waffle.zip
          VERSION=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skyward") | .version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv skyward-waffle.zip "../skyward-$VERSION-waffle-ColorOS.zip"
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skyward-*.zip
          name: OnePlus12_Skyward  ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body: |
            Device: Oneplus 12
            Target: OOS14/15/16, COS14/15/16/17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
